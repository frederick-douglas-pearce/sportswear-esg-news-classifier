name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: How might this be implemented? (optional)
    validations:
      required: false

name: Model Drift Monitoring

on:
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      classifier:
        description: 'Classifier to monitor (fp, ep, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - fp
          - ep
      days:
        description: 'Number of days to analyze'
        required: false
        default: '7'
        type: string

env:
  PYTHON_VERSION: '3.12'
  EVIDENTLY_ENABLED: 'true'

jobs:
  monitor-drift:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        classifier: ${{ github.event.inputs.classifier == 'all' && fromJson('["fp", "ep"]') || fromJson(format('["{0}"]', github.event.inputs.classifier || 'fp')) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download prediction logs
        run: |
          # Create logs directory
          mkdir -p logs/predictions

          # In a real setup, download logs from your production system
          # For example, from Google Cloud Storage:
          # gsutil -m cp "gs://${{ secrets.GCS_BUCKET }}/predictions/${{ matrix.classifier }}_predictions_*.jsonl" logs/predictions/

          # Or from an artifact store:
          # This is a placeholder - implement based on your log storage

          echo "Note: Prediction logs should be downloaded from production storage"
          echo "Configure this step based on your infrastructure"

      - name: Download reference data
        continue-on-error: true
        run: |
          # Create reference data directory
          mkdir -p data/reference

          # Download reference data if stored remotely
          # gsutil cp "gs://${{ secrets.GCS_BUCKET }}/reference/${{ matrix.classifier }}_reference.parquet" data/reference/

          echo "Note: Reference data should be downloaded from production storage"

      - name: Run drift monitoring
        id: drift
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          DAYS=${{ github.event.inputs.days || '7' }}

          # The script's contract is 0 = no drift, 1 = drift, 2 = could not
          # assess (src/mlops/exit_codes.py). `|| echo DRIFT_DETECTED=true`
          # treated all three non-zero cases as drift, so a check that could
          # not run was reported as a measured drift finding -- and `||`
          # swallowed the status, leaving the job green either way.
          set +e
          uv run python scripts/monitor_drift.py \
            --classifier ${{ matrix.classifier }} \
            --days $DAYS \
            --html-report \
            --output reports/monitoring/${{ matrix.classifier }}/drift_report.json \
            --verbose
          STATUS=$?
          set -e

          case "$STATUS" in
            0) echo "No drift detected for ${{ matrix.classifier }}" ;;
            1) echo "DRIFT_DETECTED=true" >> $GITHUB_OUTPUT ;;
            2) echo "CHECK_INDETERMINATE=true" >> $GITHUB_OUTPUT
               echo "::warning::${{ matrix.classifier }} drift could not be assessed (exit 2)" ;;
            *) echo "CHECK_INDETERMINATE=true" >> $GITHUB_OUTPUT
               echo "::warning::${{ matrix.classifier }} drift monitor exited $STATUS (unrecognised)" ;;
          esac

      - name: Upload monitoring reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monitoring-reports-${{ matrix.classifier }}
          path: |
            reports/monitoring/${{ matrix.classifier }}/
            logs/monitoring/
          retention-days: 30

      - name: Send alert on drift
        if: steps.drift.outputs.DRIFT_DETECTED == 'true'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            echo "Drift detected for ${{ matrix.classifier }} classifier"
            # Alert is sent by the monitor script when --alert flag is used
            # This step is for additional notifications if needed
          fi

  summary:
    needs: monitor-drift
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v7
        with:
          path: all-reports

      - name: Generate summary
        run: |
          echo "## Drift Monitoring Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Classifier | Status | Drift Score |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|-------------|" >> $GITHUB_STEP_SUMMARY

          for classifier in fp ep; do
            REPORT="all-reports/monitoring-reports-${classifier}/drift_report.json"
            if [ -f "$REPORT" ]; then
              # A report that does not parse is NOT a healthy report.
              #
              # Every `jq` below returns an empty string on a truncated,
              # empty or malformed file (jq fails, stderr is discarded, `$( )`
              # captures nothing). Empty matched no branch, so control fell
              # through the whole ladder to the terminal `else` and printed
              # "Healthy" with a blank score -- absence reported as health, in
              # the summary job, which is issue #71's own class. The agent side
              # already refuses this (`_validate_summary` -> UNKNOWN); this
              # side never had the guard. Reproduced with a truncated file.
              if ! jq -e . "$REPORT" >/dev/null 2>&1; then
                echo "| $classifier | ❓ Unreadable report (truncated or malformed) | - |" >> $GITHUB_STEP_SUMMARY
                continue
              fi
              # Read `indeterminate` FIRST. A check that measured nothing still
              # writes drift_detected=false and drift_score=0.0, so branching on
              # drift alone prints "Healthy" for a check that never ran -- the
              # defect issue #71 was about, in this summary (issue #71 review).
              # `has(...)`, not `.indeterminate // "missing"`: jq's `//`
              # returns its RHS when the LHS is `false` as well as `null`, so
              # the fallback form reported every CLEAN run as unknown.
              INDETERMINATE=$(jq -r 'if has("indeterminate") then (.indeterminate | tostring) else "missing" end' "$REPORT")
              # `has()` for drift too: a report missing the field must not
              # reach the healthy branch by being neither "true" nor absent.
              DRIFT=$(jq -r 'if has("drift_detected") then (.drift_detected | tostring) else "missing" end' "$REPORT")
              SCORE=$(jq -r 'if has("drift_score") then (.drift_score | tostring) else "-" end' "$REPORT")
              REASON=$(jq -r '.details.error // "no reason recorded"' "$REPORT")
              if [ "$INDETERMINATE" = "missing" ] || [ "$DRIFT" = "missing" ]; then
                echo "| $classifier | ❓ Unknown (report missing required fields) | - |" >> $GITHUB_STEP_SUMMARY
              elif [ "$INDETERMINATE" = "true" ]; then
                echo "| $classifier | ❗ Not assessed - $REASON | - |" >> $GITHUB_STEP_SUMMARY
              elif [ "$DRIFT" = "true" ]; then
                echo "| $classifier | ⚠️ Drift Detected | $SCORE |" >> $GITHUB_STEP_SUMMARY
              elif [ "$DRIFT" = "false" ] && [ "$INDETERMINATE" = "false" ]; then
                echo "| $classifier | ✅ Healthy | $SCORE |" >> $GITHUB_STEP_SUMMARY
              else
                # Only reachable if a field is present but not a boolean.
                echo "| $classifier | ❓ Unknown (indeterminate=$INDETERMINATE drift=$DRIFT) | - |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| $classifier | ❓ No Report | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports are available as workflow artifacts." >> $GITHUB_STEP_SUMMARY

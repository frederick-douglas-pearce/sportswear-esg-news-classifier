name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          # setup-uv owns the uv cache (it sets UV_CACHE_DIR to its own path).
          # cache-suffix keeps this key distinct from monitoring.yml, which syncs
          # without --extra dev; otherwise whichever workflow uploads first wins
          # the key and the other restores an incomplete cache.
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
          cache-suffix: ci
      - run: uv sync --frozen --extra dev
      - run: uv run pytest --tb=short --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: junit.xml

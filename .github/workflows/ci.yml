name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRs share a group per PR ref, so a superseding push cancels the last run.
# Pushes to main get a group per SHA: cancel-in-progress: false alone would not
# keep every merge tested, because a newly queued run cancels an already-pending
# one (max one running + one pending per group), so a merge burst could drop the
# middle commit's run. A group per SHA means main runs never queue behind each
# other in the first place.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.9'
          # setup-uv owns the uv cache (it sets UV_CACHE_DIR to its own path).
          # cache-suffix is defensive: monitoring.yml syncs this same lockfile
          # without --extra dev, and today only its wider default dependency glob
          # keeps the two keys apart. The suffix states the separation outright,
          # so aligning the globs later can't silently share a dev-less cache.
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
          cache-suffix: ci
      - run: uv sync --frozen --extra dev
      - run: uv run pytest --tb=short --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: junit.xml
